<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ぽじおレシピ">
<meta name="theme-color" content="#F3F5F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F131B" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head>
<body>
<title>ぽじおレシピブック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: enamel-white kitchen notebook. List = 2-col square photo grid; detail = one column; shop/cook = full-screen modes with oversized type and thumb-reach buttons */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --surface-2:#E8ECF2; --fg:#1A2131; --muted:#5A6477;
  --line:#D5DBE5; --line-soft:#E2E6ED; --accent:#2B4A86; --accent-fg:#FFFFFF; --accent-soft:#E1E8F6;
  --star:#D49500; --ok:#2A7A57; --ok-fg:#FFFFFF; --danger:#B3261E; --warn-soft:#FBEFD9;
  --bar:rgba(243,245,248,.9); --scrim:rgba(12,16,28,.42); --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.07);
  --img-chip-bg:rgba(10,14,24,.62); --img-chip-fg:#FFFFFF; --ph-l:86%;
  --font-display:"Hiragino Maru Gothic ProN","Zen Maru Gothic","Rounded Mplus 1c","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,-apple-system,sans-serif;
  --font-num:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F131B; --surface:#171E2B; --surface-2:#212A3A; --fg:#E7EBF2; --muted:#9AA3B6;
    --line:#2D3749; --line-soft:#232C3C; --accent:#8EAEF0; --accent-fg:#0D1730; --accent-soft:#22304B;
    --star:#F2C14E; --ok:#58C291; --ok-fg:#0B2017; --danger:#F0776F; --warn-soft:#3A2F1A;
    --bar:rgba(15,19,27,.9); --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --img-chip-bg:rgba(10,14,24,.62); --img-chip-fg:#FFFFFF; --ph-l:26%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#171E2B; --surface-2:#212A3A; --fg:#E7EBF2; --muted:#9AA3B6;
  --line:#2D3749; --line-soft:#232C3C; --accent:#8EAEF0; --accent-fg:#0D1730; --accent-soft:#22304B;
  --star:#F2C14E; --ok:#58C291; --ok-fg:#0B2017; --danger:#F0776F; --warn-soft:#3A2F1A;
  --bar:rgba(15,19,27,.9); --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --img-chip-bg:rgba(10,14,24,.62); --img-chip-fg:#FFFFFF; --ph-l:26%;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
html.locked,html.locked body{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
img{max-width:100%}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:760px;margin-inline:auto}
.ic{width:20px;height:20px;flex:none}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;text-decoration:none;color:var(--fg)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn-primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn-ghost{background:transparent}
.btn-danger{color:var(--danger);border-color:var(--line);background:transparent}
.btn-danger-solid{background:var(--danger);color:var(--surface);border-color:transparent}
.btn-block{display:flex;width:100%}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--fg)}
.icon-btn.sm{width:36px;height:36px;color:var(--muted)}
.text-btn{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 6px;border:0;background:transparent;color:var(--accent);font-size:16px}
.text-btn.strong{font-weight:700}

/* list */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line-soft)}
.appbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 2px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font-family:var(--font-display);font-size:23px;font-weight:400;letter-spacing:.03em}
.count{font-family:var(--font-num);color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.tools{display:flex;flex-direction:column;gap:10px;padding-block:6px 12px}
.search{position:relative;display:block}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;border:0;border-radius:12px;background:var(--surface-2);font-size:16px;padding:0 12px 0 40px;-webkit-appearance:none;appearance:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.list-main{padding-block:14px 120px}
.notes{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.notes:empty{display:none}
.note{margin:0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-size:14px;line-height:1.55}
.note.warn{background:var(--warn-soft)}
.note-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0;padding:0;border:0;background:none;text-align:left}
.tile-img{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--surface-2)}
.tile-img img{display:block;width:100%;height:100%;object-fit:cover}
.img-chip{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:2px 9px;border-radius:999px;background:var(--img-chip-bg);color:var(--img-chip-fg);font-size:11px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.img-chip.sample{left:auto;right:8px;bottom:auto;top:8px}
.tile-title{font-family:var(--font-display);font-size:15px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile-meta{display:flex;flex-wrap:wrap;gap:2px 8px;font-family:var(--font-num);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.t-star{color:var(--star)}
.ph{display:grid;place-items:center;width:100%;height:100%;background:hsl(var(--h) 38% var(--ph-l));font-family:var(--font-display);font-size:44px;color:var(--fg)}
.empty{grid-column:1/-1;padding:48px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;margin-bottom:6px;font-family:var(--font-display);font-size:18px;font-weight:400;color:var(--fg)}
.fab{position:fixed;right:calc(max(16px,env(safe-area-inset-right,0px)) + 2px);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;display:inline-flex;align-items:center;gap:6px;height:56px;padding:0 22px 0 18px;border:0;border-radius:28px;background:var(--accent);color:var(--accent-fg);font-size:17px;box-shadow:var(--shadow)}

/* detail & edit */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line-soft)}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:52px}
.tb-title{font-size:16px}
.detail{display:flex;flex-direction:column;gap:18px;padding-block:16px 64px}
.hero{margin:0;border-radius:20px;overflow:hidden;background:var(--surface-2)}
.hero img{display:block;width:100%;max-height:62vh;object-fit:cover}
.hero .ph{aspect-ratio:4/3;font-size:72px}
.title-block{display:flex;flex-direction:column;gap:8px}
.d-title{margin:0;font-family:var(--font-display);font-size:26px;font-weight:400;line-height:1.4;text-wrap:balance;overflow-wrap:anywhere}
.src-link{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:40px;padding:0 14px;border-radius:999px;background:var(--accent-soft);color:var(--accent);text-decoration:none;font-size:14.5px}
.src-link .ic{width:17px;height:17px}
.rate-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px}
.stars{display:flex}
.star{width:44px;height:44px;border:0;background:none;font-size:30px;line-height:1;color:var(--line);padding:0}
.star.on{color:var(--star)}
.d-stats{margin:0;font-size:14px;color:var(--muted);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-btn{display:flex;align-items:center;gap:12px;min-height:72px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left}
.big-btn .ic{width:28px;height:28px}
.big-btn b{display:block;font-size:16px}
.big-btn small{display:block;font-size:12px;color:var(--muted)}
.big-btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.big-btn.primary small{color:inherit;opacity:.8}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{display:flex;align-items:baseline;gap:10px;margin:0;font-family:var(--font-display);font-size:19px;font-weight:400}
.sub{font-family:var(--font-num);font-size:14px;color:var(--muted)}
.saved{font-family:var(--font-body);font-size:12px;color:var(--ok)}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ing li.h{padding-top:16px;border-bottom:0;color:var(--accent);font-size:14px;font-weight:700;letter-spacing:.04em}
.ing .nm{min-width:0;overflow-wrap:anywhere}
.amt{flex:none;max-width:45%;text-align:right;font-family:var(--font-num);color:var(--muted);font-variant-numeric:tabular-nums}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.num{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums}
.num .ic{width:18px;height:18px}
.steps .tx{padding-top:2px;overflow-wrap:anywhere}
.pt{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:11px;letter-spacing:.04em;vertical-align:.15em}
.steps li.point .num{background:transparent;color:var(--star)}
.muted{color:var(--muted)}
textarea,.field input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;font-size:16px;line-height:1.6}
textarea{resize:vertical;min-height:96px}
.date-add{display:flex;gap:8px;flex-wrap:wrap}
.date-add input{flex:1 1 160px;min-width:0;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font-size:16px}
.cooked{list-style:none;margin:0;padding:0}
.cooked li{display:flex;align-items:center;justify-content:space-between;padding:4px 0 4px 2px;border-bottom:1px solid var(--line-soft);font-family:var(--font-num);font-variant-numeric:tabular-nums}
.raw summary,.howto summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:40px;display:flex;align-items:center}
.raw pre{margin:0;padding:12px;border-radius:12px;background:var(--surface-2);white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--font-body);font-size:14px}
.edit{display:flex;flex-direction:column;gap:18px;padding-block:16px 80px}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700;font-size:15px}
.field small{font-weight:400;color:var(--muted);font-size:12.5px;margin-left:6px}
.err{font-style:normal;color:var(--danger);font-size:13px}
.img-pick{display:flex;gap:14px;align-items:center}
.img-prev{flex:none;width:112px;height:112px;border-radius:16px;overflow:hidden;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:12px}
.img-prev.sm{width:84px;height:84px;border-radius:14px}
.img-prev img{width:100%;height:100%;object-fit:cover;display:block}
.img-actions{display:flex;flex-direction:column;gap:6px;min-width:0}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:30;background:var(--scrim);display:flex;align-items:flex-end}
.sheet{width:100%;max-width:640px;margin-inline:auto;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.sheet-head h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:400}
.sheet-stack{display:flex;flex-direction:column;gap:12px}
.hint{margin:0;color:var(--muted);font-size:14px;line-height:1.6}
.steps-guide{margin:0;padding-left:1.4em;color:var(--muted);font-size:14px}
.set-sec{display:flex;flex-direction:column;gap:10px;padding-block:12px;border-top:1px solid var(--line-soft)}
.set-sec h3{margin:0;font-size:16px}
.kv{display:flex;justify-content:space-between;gap:12px;margin:0;font-size:14px}
.kv span{color:var(--muted)}
.kv b{text-align:right}
.ver{margin:8px 0 0;color:var(--muted);font-size:12px;text-align:center}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.thumbs{display:flex;gap:8px;overflow-x:auto;padding:2px 0}
.thumb{position:relative;flex:none;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-tag{position:absolute;left:6px;bottom:6px;padding:1px 7px;border-radius:999px;background:var(--img-chip-bg);color:var(--img-chip-fg);font-size:11px}
.thumb-del{position:absolute;top:4px;right:4px;display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:50%;background:var(--img-chip-bg);color:var(--img-chip-fg)}
.thumb-del .ic{width:16px;height:16px}
.import-status{margin:0;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px;display:flex;align-items:center;gap:10px}
.import-status::before{content:"";flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.code-input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px;font-size:16px}
.is-busy{opacity:.5;pointer-events:none}

.update-bar{position:fixed;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));z-index:50;max-width:calc(100% - 32px);padding:10px 16px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:14px;box-shadow:var(--shadow)}

/* modes */
.mode{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg);padding-top:env(safe-area-inset-top,0px)}
.mode-bar{flex:none;background:var(--bg);border-bottom:1px solid var(--line-soft)}
.mode-bar-in{display:flex;align-items:center;gap:6px;min-height:56px}
.mode-title{flex:1;min-width:0;text-align:center;font-family:var(--font-display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mode-foot{flex:none;background:var(--bar);border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom,0px)}
.mode-foot-in{display:grid;grid-template-columns:1fr 2fr;gap:10px;padding-block:10px}
.mode-foot .btn{min-height:60px;font-size:19px;border-radius:16px}
.shop-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:16px 0}
.left{font-family:var(--font-display);font-size:18px}
.left b{font-family:var(--font-num);font-size:40px;font-weight:600;margin:0 4px;font-variant-numeric:tabular-nums}
.shop-hint{margin:2px 0 4px;color:var(--muted);font-size:13px}
.shop-list{list-style:none;margin:0;padding:0 0 32px}
.shop-row{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 2px;border:0;border-bottom:1px solid var(--line-soft);background:none;text-align:left;font-size:20px}
.shop-row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.shop-row .amt{font-size:17px}
.box{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);color:transparent}
.box .ic{width:20px;height:20px}
.shop-row.on .box{background:var(--ok);border-color:var(--ok);color:var(--ok-fg)}
.shop-row.on .nm{text-decoration:line-through;color:var(--muted)}
.shop-row.on .amt{color:var(--muted)}
.shop-h{padding:18px 2px 4px;color:var(--accent);font-size:14px;font-weight:700;letter-spacing:.04em}
.wake{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:34px;padding:0 10px;border-radius:999px;border:0;background:var(--surface-2);color:var(--muted);font-size:12.5px}
.wake .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.wake.on{color:var(--ok)}
.wake.on .dot{background:var(--ok);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.cook-tools{padding-block:12px 4px}
.ing-panel{margin-top:10px;padding:6px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line-soft)}
.cook-steps{list-style:none;margin:0;padding:12px 0 40vh;display:flex;flex-direction:column;gap:12px}
.cook-step{display:grid;grid-template-columns:40px minmax(0,1fr);gap:14px;width:100%;padding:16px 14px;border-radius:18px;border:2px solid transparent;background:transparent;text-align:left;font-size:22px;line-height:1.65;opacity:.5}
.cook-step .num{width:40px;height:40px;font-size:18px}
.cook-step .num .ic{width:22px;height:22px}
.cook-step.current{opacity:1;background:var(--surface);border-color:var(--accent);box-shadow:var(--shadow)}
.cook-step.done{opacity:.4}
.cook-step.done .num{background:var(--ok);color:var(--ok-fg)}
.cook-step .tx{overflow-wrap:anywhere}

<script>
/* PARSER-START */
const KEEP_MARK = new Set(['★','☆','◎','○','●','◆','◇','■','□']);
const BULLET_RE = /^[・･•·\-–—−‐*＊▪▫►▶✔✓☑✅➡→⇒]$/u;
const PICTO_RE = /\p{Extended_Pictographic}/u;
const UNITS = '大さじ|小さじ|大匙|小匙|カップ|cc|ｃｃ|ml|mL|ｍｌ|ℓ|L|g|ｇ|kg|ｋｇ|個|コ|本|枚|片|かけ|切れ|尾|匹|房|束|株|袋|パック|缶|丁|合|玉|粒|杯|膳|cm|ｃｍ';
const QTY_WORDS = '適量|少々|少量|ひとつまみ|ひとつかみ|お好みで|お好み|適宜';
const AMOUNT_RE = new RegExp('(?:[0-9０-９½¼¾⅓⅔]\\s*(?:' + UNITS + ')|(?:大さじ|小さじ|大匙|小匙|カップ|大|小)\\s*[0-9０-９½¼¾⅓⅔]|' + QTY_WORDS + ')');
const SERV_RE = /[（(]?\s*([0-9０-９]+(?:\s*[〜~～\-－]\s*[0-9０-９]+)?)\s*(人分|人前|個分|皿分|枚分|本分|食分|杯分)\s*[）)]?/;
const SERV_WORD_RE = /作りやすい(?:分量|量)/;
const ING_HEAD_RE = /^(材料|ざいりょう|用意するもの|使うもの|使う材料|ingredients?)/i;
const STEP_HEAD_RE = /^(作り方|つくり方|作りかた|手順|調理手順|調理方法|レシピ手順|how\s*to(\s*make)?|directions|method)/i;
const POINT_HEAD_RE = /^(ポイント|コツ|point|tips?|memo|メモ)/i;
const HEAD_REST_RE = /^(は|は?こちら|一覧|リスト|です)?$/;
const GROUP_WORDS_RE = /(調味料|たれ|タレ|ソース|ドレッシング|下味|衣|トッピング|合わせ|つけだれ|生地|具材)/;
const CIRCLED = '①-⑳❶-❿➀-➉⓵-⓾';
const STEP_NUM_RE = new RegExp('^(?:(?:step|ステップ)\\s*[0-9０-９]{1,2}\\s*[.．。、,，:：)）]?\\s*|[' + CIRCLED + '](?![のをにとがはへで])\\s*|[(（]\\s*[0-9０-９]{1,2}\\s*[)）]\\s*|[0-9０-９]{1,2}\\s*(?:[.．](?![0-9０-９])|[。、,，:：)）]|\\s)\\s*)', 'i');
const MULTI_STEP_RE = new RegExp('(?<!^)(?=[' + CIRCLED + '](?![のをにとがはへで]))', 'g');
const STEPLIKE_END_RE = /(る|す|た|て|ます|ください|しょう)[。．!！]?$/;
const BARE_NUM_RE = /^([0-9０-９]{1,2})(?=[^\s0-9０-９.．、,:：)）分秒時日晩度個枚本粒合杯回割人口切袋缶丁束株房片尾匹gGmMlLcCkK%％倍〜~\-\/／])/;
const AMOUNT_ONLY_RE = new RegExp('^(?:(?:大さじ|小さじ|大匙|小匙|カップ|大|小)\\s*[0-9０-９½¼¾⅓⅔][0-9０-９½¼¾⅓⅔/／.と〜~]*|[0-9０-９½¼¾⅓⅔][0-9０-９½¼¾⅓⅔/／.〜~]*\\s*(?:' + UNITS + ')|' + QTY_WORDS + ')(?:\\s*[（(][^）)]*[）)])?$');
const CTA_RE = /(保存して(?:ね|あとで|後で|見返)|あとで見返|後で見返|保存必須|保存版|必見|ブックマーク|フォロー|いいね|コメント(?:で|して|ください|欄)|プロフ|ハイライト|リンクから|DMで|作ったら教えて|参考になったら)/;

function toHalf(s){ return String(s).replace(/[０-９Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)); }
function stripDecor(line){
  let s = String(line).replace(/[️‍]/g, '');
  for (;;){
    const ch = Array.from(s)[0];
    if (ch === undefined) break;
    if (/\s/.test(ch) || BULLET_RE.test(ch) || (PICTO_RE.test(ch) && !KEEP_MARK.has(ch))) { s = s.slice(ch.length); continue; }
    break;
  }
  return s.trim();
}
function headerCore(line){
  return String(line).replace(/\p{Extended_Pictographic}/gu, '').replace(/[️‍]/g, '')
    .replace(/[【】\[\]［］〈〉<>＜＞《》「」『』（）()■□◆◇●○◎★☆▼▽▲△▶►♪♡♥・:：\-–—=＝~〜|｜\/／\s]/g, '').trim();
}
function servingsOf(s){
  const m = String(s).match(SERV_RE);
  if (m) return toHalf(m[1]).replace(/\s/g, '') + m[2];
  return SERV_WORD_RE.test(s) ? '作りやすい分量' : '';
}
function isServingsOnly(s){
  return (SERV_RE.test(s) || SERV_WORD_RE.test(s)) && s.replace(SERV_RE, '').replace(SERV_WORD_RE, '').replace(/[\s()（）材料:：]/g, '') === '';
}
function classifyHeader(line){
  const core = headerCore(line);
  if (!core || core.length > 24) return null;
  const rest = re => core.replace(re, '').replace(SERV_RE, '').replace(SERV_WORD_RE, '').replace(/[0-9０-９]+(人分|人前)/, '');
  if (ING_HEAD_RE.test(core) && HEAD_REST_RE.test(rest(ING_HEAD_RE))) return 'ing';
  if (STEP_HEAD_RE.test(core) && HEAD_REST_RE.test(rest(STEP_HEAD_RE))) return 'step';
  if (POINT_HEAD_RE.test(core) && HEAD_REST_RE.test(rest(POINT_HEAD_RE))) return 'point';
  return null;
}
function asGroupHeading(line){
  const t = String(line).trim();
  const m = t.match(/^[【\[［〈<＜《]\s*(.+?)\s*[】\]］〉>＞》]\s*[:：]?$/);
  if (m && !AMOUNT_RE.test(m[1])) return m[1];
  if (/^[(（]?[A-DＡ-Ｄ][)）]?$/.test(t)) return toHalf(t.replace(/[()（）]/g, ''));
  const m2 = t.match(/^[■◆●▼◎★☆]?\s*(.{1,14}?)\s*[:：]?$/);
  if (m2 && !AMOUNT_RE.test(t) && GROUP_WORDS_RE.test(m2[1])) return m2[1];
  return null;
}
function normIngredient(line){
  return stripDecor(line).replace(/[…‥]+|\.{2,}|・{2,}|･{2,}/g, ' ').replace(/[：:]\s*/g, ' ').replace(/[\s　]+/g, ' ').trim();
}
function isStepLike(s){ return s.length > 8 && /[をにでへと]/.test(s) && STEPLIKE_END_RE.test(s.replace(/[)）]+$/, '')); }
function isNumbered(line){ return STEP_NUM_RE.test(String(line).trim()); }
function stripStepNum(line){ return String(line).trim().replace(STEP_NUM_RE, '').trim(); }
function joinJa(a, b){ return (/[A-Za-z0-9]$/.test(a) || /^[A-Za-z0-9]/.test(b)) ? a + ' ' + b : a + b; }
function pickTitle(lines){
  const cands = [];
  for (const raw of lines){
    let s = String(raw).trim();
    if (!s || CTA_RE.test(s)) continue;
    const deco = /^[＼\\].*[／\/]\s*$/.test(s);
    s = s.replace(/^[＼\\]+\s*|\s*[／\/]+\s*$/g, '').replace(/\p{Extended_Pictographic}/gu, '').replace(/[️‍]/g, '');
    s = s.replace(/^[【「『\[［〈《<＜]+|[】」』\]］〉》>＞]+$/g, '').replace(/[\s　]+/g, ' ').trim();
    if (!s || s.length > 40 || /^[^\p{L}\p{N}]+$/u.test(s)) continue;
    cands.push({ s, deco });
  }
  const ja = c => /[぀-ヿ一-鿿]/.test(c.s);
  const pick = cands.find(c => !c.deco && ja(c)) || cands.find(c => ja(c)) || cands.find(c => !c.deco) || cands[0];
  return pick ? pick.s : '';
}
// 何枚かのスクショの文字をつなぐ。スクロールして撮ったときに前の終わりと重なった行は外す
function mergeOcrTexts(texts){
  const out = [], key = l => l.replace(/\s/g, '');
  for (const t of texts){
    const lines = cleanOcrText(t).split('\n').map(x => x.trim()).filter(Boolean);
    let k = Math.min(out.length, lines.length);
    for (; k > 0; k--){
      let same = true;
      for (let j = 0; j < k; j++) if (key(out[out.length - k + j]) !== key(lines[j])){ same = false; break; }
      if (same) break;
    }
    out.push(...lines.slice(k));
  }
  return out.join('\n');
}
// スクショの文字読み取り結果から、インスタの画面の文字(時刻・いいね数・ユーザー名など)を外す
const UI_LINE_RE = /^(投稿|リール|フォロー中?|フォローする|メッセージ|いいね！?|返信する?|翻訳を見る|もっと見る|続きを読む|その他|シェア|保存|共有|検索|ホーム|プロフィール|広告|おすすめ|Instagram|オリジナル音源.*|.*さん(など)?が「?いいね.*|.*件のコメントを(すべて)?見る|コメントを追加.*)$/;
const USER_RE = /^(?=[A-Za-z0-9._]*[A-Za-z]{2})(?=[A-Za-z0-9._]*[._])[A-Za-z0-9._]{3,30}$/;
function cleanOcrText(text){
  return String(text || '').replace(/\r\n?/g, '\n').split('\n').map(l => l.trim()).filter(l => {
    if (!l) return true;
    if (/^[0-9０-９]{1,2}[:：][0-9０-９]{2}$/.test(l)) return false;
    if (/^[0-9０-９]{1,3}([,，][0-9０-９]{3})+$|^[0-9０-９]{4,}$/.test(l)) return false;
    if (/^[♡♥❤]\s*[0-9０-９,，.]+\s*(万|千)?\s*(件|回)?$/.test(l) || /^[0-9０-９,，.]+\s*(万|千)?\s*件$/.test(l)) return false;
    if (/^[0-9０-９]+\s*(秒|分|時間|日|週間|か月|ヶ月|年)前$/.test(l)) return false;
    if (/^[0-9０-９]{1,2}月[0-9０-９]{1,2}日$/.test(l)) return false;
    if (UI_LINE_RE.test(l) || USER_RE.test(l)) return false;
    if (/^(?:(?:[0-9]G|LTE)\+?\s*)?[0-9]{1,3}\s*[%％]$/.test(l)) return false;   // 電波と電池の表示
    if (/^[_＿\-ー─━=＝・.。、,\s○◯●]+$/.test(l)) return false;                // 記号やアイコンだけの行
    return true;
  }).map(l => l.replace(/^(?=[A-Za-z0-9._]*[A-Za-z]{2})(?=[A-Za-z0-9._]*[._])[A-Za-z0-9._]{3,30}\s+/, '')).join('\n');
}
function parseRecipeText(input){
  const out = { url: '', title: '', servings: '', ingredients: [], steps: [] };
  let text = String(input || '').replace(/\r\n?/g, '\n');
  const um = text.match(/https?:\/\/[^\s　<>"'「」]+/);
  if (um){ out.url = um[0].replace(/[)）\]】、。,.]+$/, ''); text = text.replace(um[0], ' '); }
  text = text.replace(/([0-9])️?⃣/g, '$1. ');
  const lines = [];
  for (const l0 of text.split('\n')){
    const l = l0.replace(/(\s*[#＃][^\s#＃]+)+\s*$/, '').trim();
    if (!l){ lines.push(''); continue; }
    if (CTA_RE.test(l)) continue;
    const cs = l.match(new RegExp('[' + CIRCLED + '](?![のをにとがはへで])', 'g'));
    if (cs && cs.length > 1) lines.push(...l.split(MULTI_STEP_RE).map(x => x.trim()).filter(Boolean));
    else lines.push(l);
  }
  let mode = 'intro', numbered = false, gap = false, stepNo = 0;
  let intro = [];
  const addStep = clean => {
    const bare = isNumbered(clean) ? null : clean.match(BARE_NUM_RE);
    if (isNumbered(clean)){ out.steps.push(stripStepNum(clean)); numbered = true; stepNo++; }
    else if (bare && Number(toHalf(bare[1])) === stepNo + 1){ out.steps.push(clean.slice(bare[1].length).trim()); numbered = true; stepNo++; }
    else if (numbered && out.steps.length && !gap){ const i = out.steps.length - 1; out.steps[i] = joinJa(out.steps[i], clean); }
    else out.steps.push(clean);
  };
  for (const raw of lines){
    if (!raw){ gap = true; continue; }
    const h = classifyHeader(raw);
    if (h){
      mode = h; gap = false;
      if (h === 'ing' && !out.servings) out.servings = servingsOf(raw);
      if (h === 'step'){ numbered = false; stepNo = 0; }
      continue;
    }
    const clean = stripDecor(raw);
    if (!clean){ continue; }
    if (mode === 'intro'){ intro.push(raw); gap = false; continue; }
    if (mode === 'ing'){
      if (isServingsOnly(clean)){ if (!out.servings) out.servings = servingsOf(clean); continue; }
      if ((isNumbered(clean) && !AMOUNT_RE.test(clean.slice(0, 4))) || isStepLike(clean)){ mode = 'step'; numbered = false; gap = false; addStep(clean); continue; }
      if (AMOUNT_ONLY_RE.test(clean) && out.ingredients.length){
        const i = out.ingredients.length - 1, prev = out.ingredients[i];
        if (!/^【/.test(prev) && !AMOUNT_RE.test(prev)){ out.ingredients[i] = prev + ' ' + normIngredient(clean); continue; }
      }
      const g = asGroupHeading(clean);
      if (g){ out.ingredients.push('【' + g + '】'); continue; }
      const ni = normIngredient(raw);
      if (ni) out.ingredients.push(ni);
      continue;
    }
    if (mode === 'step'){ addStep(clean); gap = false; continue; }
    if (mode === 'point'){ out.steps.push('ポイント：' + stripStepNum(clean)); continue; }
  }
  // 見出しが無かった部分は中身で判断する
  if (!out.ingredients.length || !out.steps.length){
    const needIng = !out.ingredients.length, needStep = !out.steps.length;
    const rest = [];
    let seenBody = false, n2 = false;
    for (const raw of intro){
      const clean = stripDecor(raw);
      if (isServingsOnly(clean)){ if (!out.servings) out.servings = servingsOf(clean); continue; }
      if (needStep && isNumbered(clean) && !(needIng && !n2 && AMOUNT_RE.test(clean.slice(0, 4)))){ out.steps.push(stripStepNum(clean)); n2 = true; seenBody = true; continue; }
      if (needIng && !n2 && AMOUNT_RE.test(clean) && clean.length <= 30 && !isStepLike(clean)){ out.ingredients.push(normIngredient(raw)); seenBody = true; continue; }
      if (needStep && n2 && out.steps.length){ const i = out.steps.length - 1; out.steps[i] = joinJa(out.steps[i], clean); continue; }
      if (needStep && (seenBody || isStepLike(clean)) && clean.length > 8){ out.steps.push(clean); seenBody = true; continue; }
      if (!seenBody) rest.push(raw);
    }
    intro = rest;
  }
  out.title = pickTitle(intro);
  out.ingredients = out.ingredients.filter(Boolean);
  out.steps = out.steps.filter(Boolean);
  return out;
}
// スクショの中から料理写真の部分を探す。インスタなどの画面は背景が白か黒の一色で、
// 投稿の写真だけが左端から右端まで色で埋まっている。その行が続く一番長い帯を写真とみなす。
// rgba は縮小した画像の画素(幅w・高さh)。写真の帯が見つかれば {kind:'band', x,y,w,h}(画像に対する割合)、
// 画面いっぱいが写真・動画(リールを止めた画面など)なら {kind:'full'}、写真がなければ null。
function findPhotoBand(rgba, w, h){
  const at = (x, y) => (y * w + x) * 4;
  const counts = new Map();
  for (let y = 0; y < h; y++){
    for (const x of [1, 2, w - 3, w - 2]){
      const i = at(x, y), k = (rgba[i] << 16) | (rgba[i + 1] << 8) | rgba[i + 2];
      counts.set(k, (counts.get(k) || 0) + 1);
    }
  }
  let bgKey = 0, best = -1;
  counts.forEach((n, k) => { if (n > best){ best = n; bgKey = k; } });
  const br = (bgKey >> 16) & 255, bgc = (bgKey >> 8) & 255, bb = bgKey & 255;
  // 画面の背景は白・黒・灰色の一色。そうでなければ画面いっぱいが写真や動画とみなす
  const neutral = Math.max(br, bgc, bb) - Math.min(br, bgc, bb) <= 10;
  if (best < h * 4 * 0.4 || !neutral) return { kind: 'full' };
  const isBg = (x, y) => { const i = at(x, y); return Math.abs(rgba[i] - br) <= 8 && Math.abs(rgba[i + 1] - bgc) <= 8 && Math.abs(rgba[i + 2] - bb) <= 8; };
  const edge = Math.max(2, Math.round(w * 0.04));
  const photoRow = new Array(h), rowFill = new Array(h);
  for (let y = 0; y < h; y++){
    let fill = 0, left = 0, right = 0;
    for (let x = 0; x < w; x++){
      if (!isBg(x, y)){ fill++; if (x < edge) left++; else if (x >= w - edge) right++; }
    }
    rowFill[y] = fill / w;
    photoRow[y] = rowFill[y] > 0.6 && left / edge > 0.5 && right / edge > 0.5;
  }
  const segs = [];
  let s0 = -1;
  for (let y = 0; y <= h; y++){
    const on = y < h && photoRow[y];
    if (on && s0 < 0) s0 = y;
    if (!on && s0 >= 0){ segs.push([s0, y]); s0 = -1; }
  }
  // 写真の中の白っぽい部分(行のどこかに色がある)をはさむならつなぐ。背景だけの行をはさむならつながない
  const gapMax = Math.max(2, Math.round(h * 0.03));
  const photoish = (a, b) => { for (let y = a; y < b; y++) if (rowFill[y] < 0.15) return false; return true; };
  const runs = [];
  for (const sg of segs){
    const prev = runs[runs.length - 1];
    if (prev && sg[0] - prev[1] <= gapMax && photoish(prev[1], sg[0])) prev[1] = sg[1];
    else runs.push(sg.slice());
  }
  let run = null;
  for (const r of runs) if (!run || r[1] - r[0] > run[1] - run[0]) run = r;
  if (!run) return null;
  const y0 = run[0] + 1, y1 = run[1] - 1, bh = y1 - y0;
  if (bh < w * 0.3 || bh < h * 0.1) return null;   // 小さすぎる(ボタンや帯状の飾り)
  if (bh > h * 0.9) return { kind: 'full' };         // ほぼ全面が写真・動画

function norm(s){ return toHalf(String(s || '')).toLowerCase().replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).replace(/\s+/g, ''); }
function sortedList(){
  const ca = (a, b) => (b.createdAt || '').localeCompare(a.createdAt || '');
  const rc = (a, b) => lastCooked(b).localeCompare(lastCooked(a));
  const by = {
    added: ca,
    recent: (a, b) => rc(a, b) || ca(a, b),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0) || rc(a, b) || ca(a, b),
    count: (a, b) => (b.cooked || []).length - (a.cooked || []).length || rc(a, b) || ca(a, b),
  };
  const q = norm(S.q);
  const list = q ? S.recipes.filter(r => norm([r.title, (r.ingredients || []).join(' '), r.memo].join(' ')).includes(q)) : S.recipes.slice();
  return list.sort(by[S.sort] || by.added);
}

function backupNudge(){
  if (IN_FRAME || DB.mode === 'mem') return '';

const isHeading = t => /^\s*[【\[［<＜〈《].*[】\]］>＞〉》]\s*$/.test(t) || /[:：]\s*$/.test(t);
const headingText = t => t.trim().replace(/^[【\[［<＜〈《]\s*|\s*[】\]］>＞〉》]$|[:：]\s*$/g, '');
const isPoint = t => /^ポイント[：:]/.test(t);
function splitIng(line){
  const t = String(line).trim();
  const sp = t.lastIndexOf(' ');
  if (sp > 0){
    const a = t.slice(sp + 1);
    if (a.length <= 14 && (/[0-9０-９½¼¾⅓⅔]/.test(a) || new RegExp('^(?:' + QTY_WORDS + ')').test(a) || /^(大さじ|小さじ|カップ)/.test(a))) return { nm: t.slice(0, sp), amt: a };
  }
  const m = t.match(new RegExp('^(.+?)((?:大さじ|小さじ|大匙|小匙|カップ)[0-9０-９½¼¾⅓⅔/／.〜~と]+.*|[0-9０-９½¼¾⅓⅔][0-9０-９½¼¾⅓⅔/／.〜~\\-]*\\s*(?:' + UNITS + ')?|' + QTY_WORDS + ')$'));
  if (m && m[1].length) return { nm: m[1].trim(), amt: m[2] };
  return { nm: t, amt: '' };
}
function ingListHTML(ings){
  if (!ings || !ings.length) return '<p class="muted">材料は入っていません。編集から追加できます。</p>';
  return '<ul class="ing">' + ings.map(t => {
    if (isHeading(t)) return '<li class="h">' + esc(headingText(t)) + '</li>';
    const p = splitIng(t);
    return '<li><span class="nm">' + esc(p.nm) + '</span>' + (p.amt ? '<span class="amt">' + esc(p.amt) + '</span>' : '') + '</li>';
  }).join('') + '</ul>';
}

}

const lines = t => String(t || '').split('\n').map(s => s.trim()).filter(Boolean);
async function saveDraft(){
  const x = S.draft;
  const title = $('#f-title').value.trim();
  const url = cleanUrl($('#f-url').value);
  $('#err-title').hidden = !!title; $('#err-url').hidden = url !== null;
  if (!title){ $('#f-title').focus(); return; }
  if (url === null){ $('#f-url').focus(); return; }
  const now = new Date().toISOString();
  const base = x.id ? getR(x.id) : null;
  const r = base ? Object.assign({}, base) : { id: uid(), sample: false, rating: 0, memo: '', cooked: [], shopChecked: [], thumb: '', rawText: x.rawText || '', createdAt: now };
  const ings = lines($('#f-ing').value).map(t => t.replace(/[\s　]+/g, ' '));
  if (JSON.stringify(ings) !== JSON.stringify(r.ingredients || [])) r.shopChecked = [];
  r.title = title; r.sourceUrl = url; r.servings = $('#f-serv').value.trim(); r.ingredients = ings;
  r.steps = lines($('#f-steps').value).map(t => isPoint(t) ? t : stripStepNum(t)).filter(Boolean);
  if (x.imgDirty) r.thumb = x.img ? x.img.thumb : '';
  if (!(await saveR(r))) return;
  let imgOk = true;
  if (x.imgDirty){
    try { if (x.img) await DB.put('images', { id: r.id, data: x.img.full }); else await DB.del('images', r.id); }
    catch (e) { imgOk = false; }
  }
  const dup = url && S.recipes.some(o => o.id !== r.id && o.sourceUrl === url);
  S.draft = null; clearDraft();
  showDetail(r.id);
  toast(!imgOk ? '保存しました。大きい画像だけ保存できませんでした' : (dup ? '保存しました。同じリンクのレシピが他にもあります' : '保存しました'));
}

async function runImport(op, text, imgs, url, wall){

    if (r.ok) site = checkSite(r); else problems.push(relayErrText(r.error));
  }

    for (let i = 0; i < imgs.length; i++){
      setImportStatus('スクショの文字を読み取っています(' + (i + 1) + '/' + imgs.length + ')…');

  }

  if (site && site.image){

    try { image = await dataUrlToImages(site.image); } catch (e) {}

  }

  const hasBody = ingredients.length > 0 || steps.length > 0;

    showEdit({ title: named ? title : '', sourceUrl: url, servings, ingredientsText: ingredients.join('\n'), stepsText: steps.join('\n'),
      img: image, imgDirty: !!image, rawText: combined, notice });
  };
  if (failedShots.length) return toEdit(failedShots.join('・') + '枚目のスクショを読み取れませんでした(' + problems[problems.length - 1] + ')。読み取れた分を入れたので、確かめて保存してください。');
  if (!hasBody && !(site && site.title)) return toEdit((problems[0] ? problems[0] + '。' : '') + '自動では読み取れなかったので、入れられるところを入れて保存してください。');
  const r = { id: uid(), sample: false, title, sourceUrl: cleanUrl(url) || '', servings, ingredients, steps, rating: 0, memo: '', cooked: [], shopChecked: [],
    thumb: image ? image.thumb : '', rawText: combined, createdAt: new Date().toISOString() };
  const notes = hasBody
    ? { main: '自動で登録しました', missing: !ingredients.length ? '材料は読み取れませんでした' : (!steps.length ? '作り方は読み取れませんでした' : ''), unnamed: !named }
    : { main: image ? '料理名と写真を登録しました' : '料理名を登録しました', missing: '材料と作り方はページから読み取れませんでした', unnamed: false };
  const dupOf = r.sourceUrl && S.recipes.find(o => o.sourceUrl === r.sourceUrl);

    return;
  }
  await registerImported(r, image, notes);
}

    '<div class="mode-foot"><div class="wrap mode-foot-in">' +
      '<button class="btn" data-act="cook-prev"' + (cur <= 0 ? ' disabled' : '') + '>前へ</button>' +
      (cur >= last ? '<button class="btn btn-primary" data-act="cook-done">できた！</button>' : '<button class="btn btn-primary" data-act="cook-next">次へ</button>') +
    '</div></div>';
  const body = $('#cook-body');
  if (body) body.scrollTop = keep;
  if (scroll){
    const el = $('#cook .cook-step.current');
    if (el) el.scrollIntoView({ block: 'center', behavior: scroll === 'jump' || REDUCED ? 'auto' : 'smooth' });
  }
}
function openCook(){
  const id = S.currentId;
  S.cook = { id, i: Math.min(S.cookStep[id] || 0, Math.max(0, (getR(id).steps || []).length - 1)), ingOpen: false };
  $('#cook').hidden = false; lock();
  wakeWanted = true; S.wake = 'pending';
  renderCook(S.cook.i > 0 ? 'jump' : false);
  setLast({ id, mode: 'cook', step: S.cook.i });
  acquireWake();
}
function cookTo(i){
  const r = getR(S.cook.id); const max = Math.max(0, (r.steps || []).length - 1);
  S.cook.i = Math.min(max, Math.max(0, i)); S.cookStep[S.cook.id] = S.cook.i;
  setLast({ id: S.cook.id, mode: 'cook', step: S.cook.i });
  renderCook(true);
}
function closeMode(m){
  $('#' + m).hidden = true; $('#' + m).innerHTML = '';
  if (m === 'cook'){ releaseWake(); S.cook = null; }
  unlock();
  if (S.view === 'detail'){ renderDetail(); setLast({ id: S.currentId, mode: 'detail' }); }
}

/* ---------- バックアップ ---------- */
async function prepareBackup(){
  if (IN_FRAME){ toast('この試作ページでは書き出せません。ホーム画面のアプリで使えます'); return; }
  const slot = $('#backup-slot'); if (!slot) return;
  slot.innerHTML = '<p class="hint">ファイルを作っています…</p>';
  let recipes = [], images = [];
  try { recipes = await DB.all('recipes'); images = await DB.all('images'); }
  catch (e) { slot.innerHTML = '<p class="hint">レシピを読み出せませんでした。</p>'; return; }
  const name = 'ぽじおレシピブック_バックアップ_' + todayStr() + '.json';
  const json = JSON.stringify({ app: 'pojio-recipe-book', version: 1, exportedAt: new Date().toISOString(), recipes, images });
  S.backupFile = new File([json], name, { type: 'application/json' });
  const mb = (S.backupFile.size / 1048576).toFixed(1);
  slot.innerHTML = '<p class="hint">' + recipes.length + '品・約' + mb + 'MBのファイルができました。「保存する」を押して、「ファイルに保存」かGoogleドライブを選んでください。</p>' +
    '<button class="btn btn-primary btn-block" data-act="backup-save">' + ic('down') + '保存する</button>';
}
async function markBackup(){
  S.lastBackup = new Date().toISOString();
  try { await DB.put('meta', { key: 'lastBackup', value: S.lastBackup }); } catch (e) {}
  closeSheet(); renderList(); toast('バックアップを書き出しました');
}
function downloadFile(f){
  try {
    const url = URL.createObjectURL(f), a = document.createElement('a');
    a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    markBackup();
  } catch (e) { toast('書き出せませんでした'); }
}
function saveBackup(){
  const f = S.backupFile; if (!f) return;
  let canFiles = false;
  try { canFiles = !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch (e) {}
  if (canFiles){
    navigator.share({ files: [f], title: f.name }).then(markBackup).catch(e => { if (!e || e.name !== 'AbortError') downloadFile(f); });
  } else downloadFile(f);
}
function sanitizeRecipe(r){
  if (!r || typeof r.id !== 'string' || !r.id || typeof r.title !== 'string') return null;
  const strs = a => Array.isArray(a) ? a.filter(x => typeof x === 'string') : [];
  return {
    id: r.id.slice(0, 80), sample: !!r.sample, title: r.title.slice(0, 200), sourceUrl: cleanUrl(r.sourceUrl) || '',
    servings: String(r.servings || '').slice(0, 40), ingredients: strs(r.ingredients), steps: strs(r.steps),
    rating: Math.max(0, Math.min(5, Math.round(Number(r.rating) || 0))), memo: String(r.memo || ''),
    cooked: strs(r.cooked).filter(d => /^\d{4}-\d{2}-\d{2}$/.test(d)),
    shopChecked: Array.isArray(r.shopChecked) ? r.shopChecked.filter(Number.isInteger) : [],
    thumb: DATA_IMG_RE.test(r.thumb || '') ? r.thumb : '', rawText: String(r.rawText || ''),
    createdAt: String(r.createdAt || new Date().toISOString()), updatedAt: String(r.updatedAt || ''),
  };
}
async function readBackup(file){
  let data;
  try { data = JSON.parse(await file.text()); } catch (e) { toast('バックアップのファイルを読めませんでした'); return; }
  if (!data || data.app !== 'pojio-recipe-book' || !Array.isArray(data.recipes)){ toast('ぽじおレシピブックのバックアップではないようです'); return; }
  const imgs = new Map((data.images || []).filter(i => i && typeof i.id === 'string' && DATA_IMG_RE.test(i.data || '')).map(i => [i.id, { id: i.id, data: i.data }]));
  const add = [], upd = [];
  for (const raw of data.recipes){
    const r = sanitizeRecipe(raw); if (!r) continue;
    const cur = getR(r.id);
    if (!cur) add.push(r); else if ((r.updatedAt || '') > (cur.updatedAt || '')) upd.push(r);
  }
  if (!add.length && !upd.length){ closeSheet(); toast('新しく戻すレシピはありませんでした'); return; }
  S.importPlan = { list: add.concat(upd), imgs };
  openConfirm('バックアップから戻す', add.length + '品を追加し、' + upd.length + '品を新しい内容に更新します。今あるほかのレシピは消えません。', '戻す', applyImport);
}
async function applyImport(){
  const plan = S.importPlan; S.importPlan = null; if (!plan) return;
  let n = 0;
  for (const r of plan.list){
    try {
      await DB.put('recipes', r);
      if (plan.imgs.has(r.id)) await DB.put('images', plan.imgs.get(r.id));
    } catch (e) { toast(n + '品まで戻したところで保存できなくなりました。iPhoneの空き容量を確認してください'); renderList(); return; }
    const i = S.recipes.findIndex(x => x.id === r.id);
    if (i >= 0) S.recipes[i] = r; else S.recipes.push(r);
    n++;
  }
  if (S.view !== 'list') showList(); else renderList();
  toast(n + '品を戻しました');
}
function openSettings(){
  const samples = S.recipes.filter(r => r.sample).length;
  const changed = S.lastBackup && S.recipes.some(r => !r.sample && (r.updatedAt || '') > S.lastBackup);
  openSheet(sheetHead('設定') +
    '<section class="set-sec"><h3>バックアップ</h3>' +
      '<p class="hint">レシピはこのiPhoneの中だけに保存されています。ホーム画面のアイコンを消したときや、iPhoneを買い替えたときは消える場合があるので、ときどき書き出して「ファイル」アプリやGoogleドライブに保存してください。</p>' +
      '<p class="kv"><span>最後に書き出した日</span><b>' + (S.lastBackup ? fmtLong(S.lastBackup.slice(0, 10)) + (changed ? '<br><small class="muted">そのあと変更あり</small>' : '') : 'まだ書き出していません') + '</b></p>' +
      '<p class="kv"><span>使っている容量</span><b id="usage">…</b></p>' +
      '<div id="backup-slot" class="sheet-stack"><button class="btn btn-primary btn-block" data-act="backup-prepare">' + ic('down') + 'バックアップのファイルを作る</button></div>' +
      '<label class="btn btn-block" for="import-file">' + ic('up') + 'バックアップから戻す</label><input id="import-file" class="vh" type="file" accept="application/json,.json">' +
    '</section>' +
    relaySectionHTML() +
    (samples ? '<section class="set-sec"><h3>見本のレシピ</h3><p class="hint">見本が' + samples + '品入っています。自分のレシピを入れたら消してください。</p><button class="btn btn-block" data-act="del-samples">見本を消す</button></section>' : '') +
    (DB.mode === 'mem' ? '<p class="hint">この画面ではレシピを保存できません。</p>' : '') +
    '<p class="ver">ぽじおレシピブック 試作版 v0.7.1</p>');
  const u = $('#usage');
  try {
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { if (u) u.textContent = '約' + ((e.usage || 0) / 1048576).toFixed(1) + 'MB'; }).catch(() => { if (u) u.textContent = '不明'; });
    else if (u) u.textContent = '不明';
  } catch (e) { if (u) u.textContent = '不明'; }
}

/* ---------- 操作 ---------- */
let memoTimer = null;
const ACT = {
  open: el => showDetail(el.dataset.id),
  back: () => showList(),
  edit: () => editRecipe(S.currentId),
  add: () => openAdd(),
  settings: () => openSettings(),
  sort: el => { S.sort = el.dataset.k; lsSet('pojio.sort', S.sort); renderList(); },
  star: async el => { const r = getR(S.currentId); const n = Number(el.dataset.n); r.rating = r.rating === n ? 0 : n; await saveR(r); renderDetail(); },
  'cook-today': async () => {
    const r = getR(S.currentId), t = todayStr(), had = (r.cooked || []).includes(t);
    const ok = await setCooked(r, t, !had); renderDetail();
    if (ok) toast(had ? '今日の記録を取り消しました' : '今日作ったことを記録しました');
  },
  'cook-date-add': async () => {
    const v = $('#cook-date').value; if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;

    const r = getR(S.currentId); if (await setCooked(r, v, true)){ renderDetail(); toast(fmtLong(v) + 'を記録しました'); }
  },
  'cook-del': async el => {
    const r = getR(S.currentId), d = el.dataset.d;

    renderDetail();
    toast(fmtLong(d) + 'の記録を消しました', { label: '元に戻す', run: async () => { await setCooked(r, d, true); if (S.view === 'detail') renderDetail(); } });
  },
  shop: () => openShop(),
  cook: () => openCook(),
  'shop-toggle': async el => {
    const r = getR(S.currentId), i = Number(el.dataset.i), on = new Set(r.shopChecked || []);
    const now = !on.has(i);
    now ? on.add(i) : on.delete(i);
    r.shopChecked = [...on];
    el.classList.toggle('on', now); el.setAttribute('aria-pressed', String(now));
    const left = $('#shop-left'); if (left) left.innerHTML = shopLeftHTML(shopCounts(r));
    await saveR(r);
  },
  'shop-reset': async () => {
    const r = getR(S.currentId), prev = (r.shopChecked || []).slice();
    if (!prev.length) return;
    r.shopChecked = []; renderShop(); await saveR(r);
    toast('チェックを全部外しました', { label: '元に戻す', run: async () => { r.shopChecked = prev; if (!$('#shop').hidden) renderShop(); await saveR(r); } });
  },
  'mode-close': el => closeMode(el.dataset.m),
  'cook-ing': () => { S.cook.ingOpen = !S.cook.ingOpen; renderCook(false); },
  'cook-go': el => cookTo(Number(el.dataset.i)),
  'cook-prev': () => cookTo(S.cook.i - 1),
  'cook-next': () => cookTo(S.cook.i + 1),
  'cook-done': async () => {
    const r = getR(S.cook.id), t = todayStr(), had = (r.cooked || []).includes(t);
    S.cookStep[r.id] = 0;
    const ok = had ? true : await setCooked(r, t, true);
    closeMode('cook');
    if (!ok) return;
    if (had) toast('今日の記録はもう付いています');
    else toast('今日作ったことを記録しました', { label: '取り消す', run: async () => { await setCooked(r, t, false); if (S.view === 'detail') renderDetail(); } });
  },
  'wake-retry': () => acquireWake(),
  'sheet-close': () => dismissSheet(),
  'confirm-ok': async () => { const run = confirmRun; confirmRun = null; confirmCancel = null; closeSheet(); if (run) await run(); },
  'confirm-cancel': async () => { const run = confirmCancel; confirmRun = null; confirmCancel = null; closeSheet(); if (run) await run(); },
  'toast-action': async () => { const run = S.toastRun; S.toastRun = null; $('#toast').hidden = true; if (run) await run(); },
  'add-manual': () => { clearDraft(); closeSheet(); showEdit({}); },
  'add-go': () => {
    if (S.preparing){ toast('画像を準備しています。少し待ってから押してください'); return; }
    if (relayReady()) return autoImport();
    const t = $('#add-text').value;
    if (!t.trim() && !S.addImgs.length){ toast('URLか文章を貼り付けるか、画像を選んでください'); return; }
    goParse(t, S.addImgs[0] || null);
  },
  'add-img-del': el => { S.addImgs.splice(Number(el.dataset.i), 1); const box = $('#add-imgs'); box.innerHTML = addImgsHTML(); box.hidden = !S.addImgs.length; queueDraft(); },
  'import-cancel': () => cancelImport(),
  'paste-url': async () => {
    const ta = $('#add-text');
    let t = '';
    try { t = (await navigator.clipboard.readText() || '').trim(); }
    catch (e) { toast('下の欄を長押しして「ペースト」を選んでください'); return; }
    if (!/^https?:\/\//.test(t)){ toast('コピーされているのはURLではないようです'); return; }
    ta.value = t; queueDraft(); maybeAutoFromPaste();
  },
  'paste-clip': async el => {
    const ta = $('#' + el.dataset.t);
    try { const t = await navigator.clipboard.readText(); if (t){ ta.value = ta.value ? ta.value.replace(/\s+$/, '') + '\n' + t : t; queueDraft(); if (ta.id === 'add-text') maybeAutoFromPaste(); } }
    catch (e) { toast('欄を長押しして「ペースト」を選んでください'); }
  },
  'relay-save': async () => {
    const input = $('#relay-code'), cfg = parseRelayCode(input && input.value);
    if (!cfg){ toast('設定コードの形が違います。届いたコードをそのまま貼り付けてください'); return; }

    const r = await checkRelay(cfg);
    if (!r) return;
    if (!r.ok){ setRelayState('つながりませんでした'); if (r.error !== 'aborted') toast(relayErrText(r.error)); return; }

  'relay-test': async () => {

  },
  'relay-clear': async () => {

  'edit-cancel': () => { const id = S.draft && S.draft.id; S.draft = null; clearDraft(); id ? showDetail(id) : showList(); },
  'edit-save': () => saveDraft(),
  'edit-remove-img': () => { const x = S.draft; x.img = null; x.thumb = ''; x.imgDirty = true; $('#img-prev').textContent = '画像なし'; $('#img-remove').hidden = true; queueDraft(); },
  'edit-delete': () => {

      try { await DB.del('recipes', id); await DB.del('images', id); } catch (e) { toast('削除できませんでした'); return; }
      S.recipes = S.recipes.filter(x => x.id !== id); S.draft = null; clearDraft(); showList();
      toast('削除しました', { label: '元に戻す', run: async () => { try { await DB.put('recipes', r); if (img) await DB.put('images', img); S.recipes.push(r); renderList(); } catch (e) { toast('元に戻せませんでした'); } } });

};
document.addEventListener('click', e => {
  if (e.target.id === 'sheet'){ dismissSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn){
    try { const p = fn(el, e); if (p && p.catch) p.catch(err => { console.error(err); toast('うまく動きませんでした。もう一度試してください'); }); }
    catch (err) { console.error(err); toast('うまく動きませんでした。もう一度試してください'); }
  }
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'q'){ S.q = e.target.value; renderList(); return; }
  if (id === 'memo'){
    const v = e.target.value, rid = S.currentId;
    clearTimeout(memoTimer);
    memoTimer = setTimeout(async () => {
      const r = getR(rid); if (!r) return;
      r.memo = v;
      if (await saveR(r)){ const s = $('#memo-saved'); if (s){ s.hidden = false; setTimeout(() => { s.hidden = true; }, 1500); } }
    }, 600);
    return;
  }
  if (id === 'add-text' || /^f-/.test(id)) queueDraft();
});
document.addEventListener('change', async e => {
  const t = e.target;
  const file = t.files && t.files[0];
  if (!file) return;
  if (t.id === 'img-file'){
    try {
      const im = await fileToImages(file);
      Object.assign(S.draft, { img: im, imgDirty: true });
      $('#img-prev').innerHTML = imgTag(im.thumb); $('#img-remove').hidden = false; queueDraft();
    } catch (err) { toast('この画像は読み込めませんでした'); }
  } else if (t.id === 'add-file'){
    const gen = S.addGen, auto = relayReady();
    const room = auto ? MAX_SHOTS - S.addImgs.length : 1;
    const all = Array.from(t.files), files = all.slice(0, Math.max(0, room));
    t.value = '';
    if (!files.length){ toast('スクショは' + MAX_SHOTS + '枚までです'); return; }
    if (auto && all.length > files.length) toast('スクショは' + MAX_SHOTS + '枚までなので、' + files.length + '枚だけ入れます');
    S.preparing = (S.preparing || 0) + 1; setPrepState();
    try {
      for (const f of files){
        let im = null;
        try { im = await fileToImages(f, auto); } catch (err) { toast('読み込めない画像がありました'); }
        if (gen !== S.addGen) return;
        if (im){ if (auto) S.addImgs.push(im); else S.addImgs = [im]; }
      }
    } finally {
      if (gen === S.addGen){ S.preparing = Math.max(0, S.preparing - 1); setPrepState(); }
    }
    const box = $('#add-imgs'); if (box){ box.innerHTML = addImgsHTML(); box.hidden = !S.addImgs.length; }
    queueDraft();
    if (auto && S.addImgs.length && !S.importing && !S.preparing) autoImport();
    return;
  } else if (t.id === 'import-file'){
    await readBackup(file);
  }
  t.value = '';
});
document.addEventListener('paste', e => { if (e.target && e.target.id === 'add-text') setTimeout(maybeAutoFromPaste, 60); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#sheet').hidden) dismissSheet();
  else if (!$('#cook').hidden) closeMode('cook');
  else if (!$('#shop').hidden) closeMode('shop');
});

/* ---------- 起動 ---------- */
async function init(){
  await DB.open();
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch (e) {}
  S.sort = lsGet('pojio.sort') || 'added';
  let recipes = [], seeded = null;
  try { recipes = await DB.all('recipes'); } catch (e) {}
  try { seeded = await DB.get('meta', 'seeded'); } catch (e) {}
  if (!recipes.length && !seeded){
    recipes = await seedSamples();
    try { await DB.put('meta', { key: 'seeded', value: true }); } catch (e) {}
  }
  try { const b = await DB.get('meta', 'lastBackup'); S.lastBackup = b ? b.value : null; } catch (e) {}
  try { const rl = await DB.get('meta', 'relay'); S.relay = rl && rl.value && typeof rl.value.url === 'string' && typeof rl.value.token === 'string' ? rl.value : null; } catch (e) {}
  try { const d = await DB.get('meta', 'draft'); if (d && d.value && Date.now() - (d.value.at || 0) < 7 * 864e5) S.pendingDraft = d.value; } catch (e) {}
  S.recipes = recipes;
  $('#mem-banner').hidden = DB.mode !== 'mem';
  showListOrResume();
}
function showListOrResume(){
  const last = lsGet('pojio.last');
  setView('list'); renderList();
  if (!S.pendingDraft && last && Date.now() - (last.at || 0) < 6 * 36e5 && getR(last.id)){
    showDetail(last.id);
    if (last.mode === 'shop') openShop();
    if (last.mode === 'cook'){ S.cookStep[last.id] = last.step || 0; openCook(); }
  } else setLast(null);
}
init();
})();

<script>

    b.className = 'update-bar'; b.type = 'button';
    b.textContent = '新しい版になりました。タップで読み込み直す';
    b.onclick = function () { location.reload(); };
    document.body.appendChild(b);
  };
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      reg.addEventListener('updatefound', function () {

      });

  });

  });
}
